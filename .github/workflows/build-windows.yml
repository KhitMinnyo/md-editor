name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-exe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust-target: x86_64-pc-windows-msvc
            bundle-path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - arch: arm64
            rust-target: aarch64-pc-windows-msvc
            bundle-path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clean install dependencies
        run: |
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          npm install

      - name: Build Tauri app
        run: npx --package=@tauri-apps/cli tauri build --bundles nsis --target ${{ matrix.rust-target }}

      - name: Debug - List bundle output
        run: |
          echo "=== Listing src-tauri/target/ bundle directories ==="
          Get-ChildItem -Recurse src-tauri/target/ -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*bundle*' } | ForEach-Object { $_.FullName }

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: md-editor-${{ matrix.arch }}-exe
          path: ${{ matrix.bundle-path }}
          if-no-files-found: error

  release:
    needs: build-exe
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true
