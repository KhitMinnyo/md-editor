name: Build Linux .deb Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm install

      - name: Build Tauri app
        env:
          # Updater signing (optional; see README "Auto-Update Setup").
          # `tauri build` signs the update artifact when these are set, and
          # skips signing silently when they're empty — safe either way.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --package=@tauri-apps/cli tauri build --bundles deb

      - name: Debug - List bundle output
        run: |
          echo "=== Listing src-tauri/target/release/bundle/ ==="
          find src-tauri/target/release/bundle/ -type f 2>/dev/null || echo "Bundle directory not found"

      - name: Find and upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: md-editor-${{ matrix.arch }}-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
          generate_release_notes: true
